apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: file-parsing-servicemonitor
  namespace: reflection
  labels:
    app: file-parsing
    release: prometheus
spec:
  selector:
    matchLabels:
      app: file-parsing
  namespaceSelector:
    matchNames:
      - reflection
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      scheme: http
      honorLabels: true
      # Optional relabeling to reduce cardinality or drop sensitive labels
      metricRelabelings: []
