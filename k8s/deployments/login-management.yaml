---
# ==========================================
# Login Management Service - Deployment & Service
# ==========================================
# Authentication, OAuth, and user management
# Port: 5001, Internal ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-management-deployment
  namespace: reflection
  labels:
    app: login-management
    tier: backend
    version: v1
spec:
  replicas: 2  # High availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: login-management
  template:
    metadata:
      labels:
        app: login-management
        tier: backend
        version: v1
    spec:
      # Security Context for Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: login-management
        image: reflection/login-management:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 5001
          protocol: TCP
        
        # Environment variables from ConfigMap and Secrets
        envFrom:
        - configMapRef:
            name: reflection-config
        - secretRef:
            name: reflection-secrets
        
        # Additional specific environment variables
        env:
        - name: SERVICE_NAME
          value: "login-management"
        - name: PORT
          value: "5001"
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: MONGO_INITDB_ROOT_PASSWORD
        - name: MONGODB_URI
          value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@$(MONGODB_HOST):$(MONGODB_PORT)/$(DATABASE_NAME)?authSource=$(MONGODB_AUTH_SOURCE)"
        
        # Resource limits and requests
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Security Context for Container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 2
        
        # Startup Probe
        startupProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
      
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: login-management-service
  namespace: reflection
  labels:
    app: login-management
    tier: backend
spec:
  type: ClusterIP  # Internal only
  selector:
    app: login-management
  ports:
  - name: http
    port: 5001
    targetPort: 5001
    protocol: TCP
  sessionAffinity: None
