---
# ==========================================
# Resources Service - Deployment & Service
# ==========================================
# Learning resources, embeddings, and vector similarity search
# Port: 5005, Internal ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: resources-deployment
  namespace: reflection
  labels:
    app: resources
    tier: backend
    version: v1
spec:
  replicas: 1  # High availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: resources
  template:
    metadata:
      labels:
        app: resources
        tier: backend
        version: v1
    spec:
      # Security Context for Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: resources
        image: reflection/resources:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 5005
          protocol: TCP
        
        # Environment variables
        envFrom:
        - configMapRef:
            name: reflection-config
        - secretRef:
            name: reflection-secrets
        
        env:
        - name: SERVICE_NAME
          value: "resources"
        - name: PORT
          value: "5005"
        # MongoDB Credentials
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: MONGO_INITDB_ROOT_PASSWORD
        # Construct MongoDB URI using credentials from secret and config from ConfigMap
        - name: MONGODB_URI
          value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@$(MONGODB_HOST):$(MONGODB_PORT)/?authSource=$(MONGODB_AUTH_SOURCE)"
        
        # Resource limits (ML embeddings need more resources)
        resources:
          requests:
            memory: "768Mi"
            cpu: "500m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        
        # Security Context for Container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # ML models need cache
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /health
            port: 5005
            scheme: HTTP
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /health
            port: 5005
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 2
        
        # Startup Probe (ML models need time)
        startupProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 25  # Allow up to 4 minutes for startup
      
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: resources-service
  namespace: reflection
  labels:
    app: resources
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: resources
  ports:
  - name: http
    port: 5005
    targetPort: 5005
    protocol: TCP
  sessionAffinity: None
