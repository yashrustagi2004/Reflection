---
# ==========================================
# Ingress - Single Entry Point for All Services
# ==========================================
# Routes traffic based on URL paths
# Accessible at: http://localhost

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reflection-ingress
  namespace: reflection
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    # Increase timeouts for file uploads and long-running requests
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  labels:
    app: reflection
    tier: networking
spec:
  ingressClassName: nginx
  rules:
  - host: localhost  # Access via localhost
    http:
      paths:
      # Frontend - Root path
      - path: /()(.*)
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      
      # Login Management API
      - path: /api/login(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: login-management-service
            port:
              number: 5001
      
      # File Parsing API
      - path: /api/file-parsing(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: file-parsing-service
            port:
              number: 5002
      
      # Q&A Generation API
      - path: /api/qa(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: qa-generation-service
            port:
              number: 5003
      
      # Resources API
      - path: /api/resources(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: resources-service
            port:
              number: 5004
      
      # Speech-to-Text API
      - path: /api/stt(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: speechtotext-service
            port:
              number: 5005

---
