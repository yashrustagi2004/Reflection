---
# ==========================================
# Simple Ingress - Direct Path Routing
# ==========================================
# Simpler configuration without regex rewriting
# Accessible at: http://localhost:8000

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reflection-ingress-simple
  namespace: reflection
  annotations:
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  labels:
    app: reflection
    tier: networking
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # API Endpoints (must come before root to match first)
      - path: /api/login
        pathType: Prefix
        backend:
          service:
            name: login-management-service
            port:
              number: 5001
      
      - path: /api/file-parsing
        pathType: Prefix
        backend:
          service:
            name: file-parsing-service
            port:
              number: 5002
      
      - path: /api/qa
        pathType: Prefix
        backend:
          service:
            name: qa-generation-service
            port:
              number: 5003
      
      - path: /api/resources
        pathType: Prefix
        backend:
          service:
            name: resources-service
            port:
              number: 5004
      
      - path: /api/stt
        pathType: Prefix
        backend:
          service:
            name: speechtotext-service
            port:
              number: 5005
      
      # Frontend - Root path (must be last)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
