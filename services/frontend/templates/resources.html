<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources - AI Interview Platform</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <style>
        /* ============================================
           GLOBAL STYLES & RESET
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6B46C1 0%, #7C3AED 25%, #8B5CF6 50%, #4C9FE8 75%, #5BC0DE 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* ============================================
           SIDEBAR NAVIGATION
           ============================================ */
        .sidebar {
            width: 250px;
            background: rgba(40, 20, 80, 0.95);
            backdrop-filter: blur(15px);
            padding: 30px 0;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 1000;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header {
            padding: 0 30px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .sidebar-header h2 {
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .nav-menu {
            list-style: none;
            padding: 0 20px;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 15px 15px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateX(5px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #9D7FDB 0%, #B399E8 100%);
            color: white;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            font-size: 18px;
        }

        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: #6B46C1;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }

        .mobile-menu-toggle:active {
            transform: scale(0.95);
        }

        /* ============================================
           MAIN CONTENT AREA
           ============================================ */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 40px;
            min-height: 100vh;
        }

        .content-header {
            margin-bottom: 48px;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            color: white;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .page-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            font-weight: 400;
            line-height: 1.6;
        }

        /* ============================================
           RESOURCES CONTAINER
           ============================================ */
        .resources-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .resources-grid {
            display: grid;
            gap: 24px;
        }

        /* Loading State */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: white;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           CATEGORY ACCORDION
           ============================================ */
        .category-accordion {
            margin-bottom: 20px;
            animation: slideInUp 0.5s ease-out;
            animation-fill-mode: both;
        }

        .category-accordion:nth-child(1) { animation-delay: 0.1s; }
        .category-accordion:nth-child(2) { animation-delay: 0.15s; }
        .category-accordion:nth-child(3) { animation-delay: 0.2s; }
        .category-accordion:nth-child(4) { animation-delay: 0.25s; }
        .category-accordion:nth-child(5) { animation-delay: 0.3s; }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Category Header */
        .category-header {
            background: white;
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 28px 32px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .category-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.03) 0%, rgba(118, 75, 162, 0.03) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .category-header:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            border-color: rgba(102, 126, 234, 0.2);
        }

        .category-header:hover::before {
            opacity: 1;
        }

        .category-header.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
        }

        .category-header-content {
            display: flex;
            align-items: center;
            gap: 24px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .category-icon-wrapper {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
            transition: all 0.3s ease;
        }

        .category-header:hover .category-icon-wrapper {
            transform: scale(1.08) rotate(-5deg);
            box-shadow: 0 12px 28px rgba(102, 126, 234, 0.45);
        }

        .category-info {
            flex: 1;
        }

        .category-name {
            font-size: 26px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .category-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: white;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            color: #667eea;
            border: 2px solid rgba(102, 126, 234, 0.15);
            transition: all 0.2s ease;
        }

        .stat-badge:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .stat-badge .icon {
            font-size: 16px;
        }

        .expand-indicator {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .category-header.active .expand-indicator {
            transform: rotate(180deg);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        /* Category Body */
        .category-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-body.active {
            max-height: 5000px;
        }

        .category-content {
            background: white;
            border-radius: 0 0 16px 16px;
            padding: 0 32px 32px 32px;
            margin-top: -8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        /* Resource Tabs */
        .resource-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            padding-top: 32px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.06);
        }

        .tab-button {
            padding: 14px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 15px;
            font-weight: 600;
            color: #718096;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            margin-bottom: -2px;
            border-radius: 8px 8px 0 0;
        }

        .tab-button:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: rgba(102, 126, 234, 0.08);
        }

        .tab-count {
            display: inline-block;
            margin-left: 8px;
            padding: 3px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            font-size: 12px;
            color: white;
            font-weight: 700;
        }

        /* Resource Lists */
        .resource-list {
            display: none;
        }

        .resource-list.active {
            display: grid;
            gap: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Resource Cards */
        .resource-card {
            background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
            border: 2px solid rgba(0, 0, 0, 0.06);
            border-radius: 14px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .resource-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .resource-card:hover {
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
            transform: translateX(6px);
            background: white;
        }

        .resource-card:hover::before {
            transform: scaleY(1);
        }

        .resource-link {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            text-decoration: none;
            color: inherit;
        }

        .resource-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
            transition: all 0.3s ease;
            border: 2px solid rgba(102, 126, 234, 0.15);
        }

        .resource-card:hover .resource-icon {
            transform: scale(1.1) rotate(-5deg);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .resource-details {
            flex: 1;
        }

        .resource-title {
            font-size: 17px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
            line-height: 1.5;
            letter-spacing: -0.2px;
        }

        .resource-description {
            font-size: 14px;
            color: #718096;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .resource-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: #a0aec0;
        }

        .external-link-icon {
            color: #667eea;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .resource-card:hover .external-link-icon {
            transform: translate(4px, -4px);
        }

        /* Project Cards - Special Styling */
        .project-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.03) 0%, rgba(118, 75, 162, 0.03) 100%);
            border: 2px solid rgba(102, 126, 234, 0.15);
        }

        .project-card:hover {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
        }

        .project-card .resource-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .project-objective {
            font-size: 14px;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: white;
            border-radius: 8px;
            border: 2px solid rgba(102, 126, 234, 0.15);
        }

        .project-objective::before {
            content: '🎯';
            font-size: 16px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .empty-state-icon {
            font-size: 72px;
            margin-bottom: 24px;
            opacity: 0.7;
        }

        .empty-state-text {
            font-size: 18px;
            color: #718096;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto;
        }

        .empty-state-button {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .empty-state-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 968px) {
            .main-content {
                padding: 32px;
            }

            .page-title {
                font-size: 32px;
            }

            .category-name {
                font-size: 22px;
            }
        }

        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: block;
            }

            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
                padding-top: 80px;
            }

            .page-title {
                font-size: 28px;
            }

            .page-subtitle {
                font-size: 16px;
            }

            .category-header {
                padding: 20px 24px;
            }

            .category-header-content {
                gap: 16px;
            }

            .category-icon-wrapper {
                width: 56px;
                height: 56px;
                font-size: 28px;
            }

            .category-name {
                font-size: 20px;
            }

            .resource-card {
                padding: 20px;
            }

            .resource-link {
                gap: 16px;
            }

            .resource-icon {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 15px;
                padding-top: 70px;
            }

            .page-title {
                font-size: 26px;
            }

            .category-header {
                padding: 16px 20px;
            }

            .category-stats {
                gap: 8px;
            }

            .stat-badge {
                padding: 6px 12px;
                font-size: 12px;
            }

            .resource-tabs {
                gap: 4px;
                overflow-x: auto;
            }

            .tab-button {
                padding: 12px 18px;
                font-size: 14px;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <button class="mobile-menu-toggle" onclick="toggleSidebar()" aria-label="Toggle menu">☰</button>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Resources</h2>
            </div>
            
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="{{ url_for('dashboard') }}" class="nav-link">
                            <span class="nav-icon">🏠</span>
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('practice') }}" class="nav-link">
                            <span class="nav-icon">✏️</span>
                            Practice
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('resources') }}" class="nav-link active">
                            <span class="nav-icon">📚</span>
                            Resources
                        </a>
                    </li>
                </ul>
            </nav>
            
            <!-- Profile and Logout Navigation -->
            <div style="border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 20px; padding-top: 20px;">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="{{ url_for('profile') }}" class="nav-link">
                            <span class="nav-icon">⚙️</span>
                            Profile Settings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('logout') }}" class="nav-link">
                            <span class="nav-icon">🚪</span>
                            Logout
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-header">
                <h1 class="page-title">Recommended Resources: Test Jenkins 12</h1>
                <p class="page-subtitle">Explore courses, certifications, and projects to enhance your interview preparation.</p>
            </div>

            <div class="resources-container">
                <div class="resources-grid" id="resources-grid">
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <p>Loading your personalized resources...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.querySelector('.mobile-menu-toggle');
            
            if (window.innerWidth <= 768 && 
                !sidebar.contains(event.target) && 
                !menuToggle.contains(event.target) &&
                sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            loadCategorizedResources();
        });

        async function loadCategorizedResources() {
            try {
                const categoriesResponse = await fetch('/api/resources/user-categories', {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!categoriesResponse.ok) {
                    throw new Error('Failed to fetch categories');
                }
                
                const categoriesData = await categoriesResponse.json();
                
                if (!categoriesData.success || !categoriesData.categories || categoriesData.categories.length === 0) {
                    showNoResourcesMessage('No job categories detected yet. Please upload your resume and job description first.');
                    return;
                }
                
                console.log('📋 Detected categories:', categoriesData.categories);
                
                const resourcesResponse = await fetch('/api/resources/categorized', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        categories: categoriesData.categories
                    })
                });
                
                if (!resourcesResponse.ok) {
                    throw new Error('Failed to fetch resources');
                }
                
                const resourcesData = await resourcesResponse.json();
                
                if (resourcesData.success && resourcesData.resources) {
                    renderCategorizedResources(resourcesData.resources);
                } else {
                    showNoResourcesMessage('Failed to load resources. Please try again later.');
                }
                
            } catch (error) {
                console.error('❌ Error loading categorized resources:', error);
                showNoResourcesMessage('Error loading resources. Please check your connection.');
            }
        }

        function renderCategorizedResources(resourcesData) {
            const resourcesGrid = document.getElementById('resources-grid');
            resourcesGrid.innerHTML = '';
            
            const hasResources = Object.keys(resourcesData).some(category => {
                const resource = resourcesData[category];
                return (resource.courses && resource.courses.length > 0) ||
                       (resource.certifications && resource.certifications.length > 0) ||
                       (resource.projects && resource.projects.length > 0);
            });
            
            if (!hasResources) {
                showNoResourcesMessage('No resources available for your detected categories.');
                return;
            }
            
            Object.keys(resourcesData).forEach(category => {
                const resource = resourcesData[category];
                const categoryTile = createCategoryAccordion(category, resource);
                resourcesGrid.appendChild(categoryTile);
            });
        }

        function createCategoryAccordion(category, resource) {
            const accordion = document.createElement('div');
            accordion.className = 'category-accordion';
            
            const coursesCount = resource.courses ? resource.courses.length : 0;
            const certificationsCount = resource.certifications ? resource.certifications.length : 0;
            const projectsCount = resource.projects ? resource.projects.length : 0;
            const totalCount = coursesCount + certificationsCount + projectsCount;
            
            accordion.innerHTML = `
                <div class="category-header" onclick="toggleCategory(this)">
                    <div class="category-header-content">
                        <div class="category-icon-wrapper">${getCategoryIcon(category)}</div>
                        <div class="category-info">
                            <h3 class="category-name">${escapeHtml(category)}</h3>
                            <div class="category-stats">
                                ${coursesCount > 0 ? `<span class="stat-badge"><span class="icon">📚</span>${coursesCount} Courses</span>` : ''}
                                ${certificationsCount > 0 ? `<span class="stat-badge"><span class="icon">🎓</span>${certificationsCount} Certifications</span>` : ''}
                                ${projectsCount > 0 ? `<span class="stat-badge"><span class="icon">💼</span>${projectsCount} Projects</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="expand-indicator">▼</div>
                </div>
                <div class="category-body">
                    <div class="category-content">
                        ${createResourceTabs(resource, category)}
                    </div>
                </div>
            `;
            
            return accordion;
        }

        function createResourceTabs(resource, category) {
            const coursesCount = resource.courses ? resource.courses.length : 0;
            const certificationsCount = resource.certifications ? resource.certifications.length : 0;
            const projectsCount = resource.projects ? resource.projects.length : 0;
            
            let html = '<div class="resource-tabs">';
            
            if (coursesCount > 0) {
                html += `<button class="tab-button active" onclick="switchTab(this, 'courses-${category}')">Courses<span class="tab-count">${coursesCount}</span></button>`;
            }
            if (certificationsCount > 0) {
                html += `<button class="tab-button ${coursesCount === 0 ? 'active' : ''}" onclick="switchTab(this, 'certifications-${category}')">Certifications<span class="tab-count">${certificationsCount}</span></button>`;
            }
            if (projectsCount > 0) {
                html += `<button class="tab-button ${coursesCount === 0 && certificationsCount === 0 ? 'active' : ''}" onclick="switchTab(this, 'projects-${category}')">Projects<span class="tab-count">${projectsCount}</span></button>`;
            }
            
            html += '</div>';
            
            // Courses List
            if (coursesCount > 0) {
                html += `<div class="resource-list active" id="courses-${category}">`;
                resource.courses.forEach(course => {
                    html += `
                        <div class="resource-card">
                            <a href="${escapeHtml(course.link)}" target="_blank" rel="noopener noreferrer" class="resource-link">
                                <div class="resource-icon">📚</div>
                                <div class="resource-details">
                                    <h4 class="resource-title">${escapeHtml(course.title)}</h4>
                                    <p class="resource-description">Comprehensive course to master ${escapeHtml(category)} skills</p>
                                    <div class="resource-meta">
                                        <span>🔗 External Link</span>
                                    </div>
                                </div>
                                <span class="external-link-icon">↗</span>
                            </a>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            // Certifications List
            if (certificationsCount > 0) {
                html += `<div class="resource-list ${coursesCount === 0 ? 'active' : ''}" id="certifications-${category}">`;
                resource.certifications.forEach(cert => {
                    html += `
                        <div class="resource-card">
                            <a href="${escapeHtml(cert.link)}" target="_blank" rel="noopener noreferrer" class="resource-link">
                                <div class="resource-icon">🎓</div>
                                <div class="resource-details">
                                    <h4 class="resource-title">${escapeHtml(cert.title)}</h4>
                                    <p class="resource-description">Professional certification to validate your expertise</p>
                                    <div class="resource-meta">
                                        <span>🏆 Certification</span>
                                        <span>🔗 External Link</span>
                                    </div>
                                </div>
                                <span class="external-link-icon">↗</span>
                            </a>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            // Projects List
            if (projectsCount > 0) {
                html += `<div class="resource-list ${coursesCount === 0 && certificationsCount === 0 ? 'active' : ''}" id="projects-${category}">`;
                resource.projects.forEach(project => {
                    html += `
                        <div class="resource-card project-card">
                            <div class="resource-link">
                                <div class="resource-icon">💼</div>
                                <div class="resource-details">
                                    <div class="project-objective">${escapeHtml(project.objective)}</div>
                                    <h4 class="resource-title">${escapeHtml(project.title)}</h4>
                                    <p class="resource-description">${escapeHtml(project.description)}</p>
                                    <div class="resource-meta">
                                        <span>📂 Hands-on Project</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            return html;
        }

        function toggleCategory(header) {
            const accordion = header.parentElement;
            const body = accordion.querySelector('.category-body');
            
            header.classList.toggle('active');
            body.classList.toggle('active');
        }

        function switchTab(button, tabId) {
            const category = button.closest('.category-content');
            const tabs = category.querySelectorAll('.tab-button');
            const lists = category.querySelectorAll('.resource-list');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            lists.forEach(list => list.classList.remove('active'));
            
            button.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function getCategoryIcon(category) {
            const icons = {
                'DevOps': '⚙️',
                'Social Media Marketing': '📱',
                'VAPT': '🔒',
                'Biotech': '🧬',
                'SOC': '🛡️',
                'AI': '🤖',
                'Accounting': '💰',
                'Software Engineering': '💻',
                'Data Science': '📊',
                'Cloud Computing': '☁️',
                'Cybersecurity': '🔐',
                'Machine Learning': '🧠',
                'Web Development': '🌐',
                'Mobile Development': '📱'
            };
            return icons[category] || '📚';
        }

        function showNoResourcesMessage(message) {
            const resourcesGrid = document.getElementById('resources-grid');
            resourcesGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📚</div>
                    <p class="empty-state-text">${escapeHtml(message)}</p>
                    <a href="{{ url_for('dashboard') }}" class="empty-state-button">Go to Dashboard</a>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
