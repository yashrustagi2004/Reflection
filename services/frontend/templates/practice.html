<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - AI Interview Platform</title>

    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6B46C1 0%, #7C3AED 25%, #8B5CF6 50%, #4C9FE8 75%, #5BC0DE 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: rgba(40, 20, 80, 0.95);
            backdrop-filter: blur(15px);
            padding: 30px 0;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header {
            padding: 0 30px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .sidebar-header h2 {
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .nav-menu {
            list-style: none;
            padding: 0 20px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 15px 15px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: 500;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            margin-right: 15px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 30px;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* Search & Filter */
        .search-filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box input {
            padding: 10px 15px;
            border-radius: 25px;
            border: 1px solid #ccc;
            width: 250px;
            outline: none;
        }

        .filter-dropdown select {
            padding: 10px 15px;
            border-radius: 25px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
        }

        /* Question Cards */
        .question-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .question-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-top: 4px solid #6B46C1;
        }

        .question-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .question-text {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-tag {
            background: #f0f9ff;
            color: #0c4a6e;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .difficulty {
            font-size: 13px;
            font-weight: 600;
            color: #6B46C1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
            }

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .search-filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box input {
                width: 100%;
            }

            .filter-dropdown select {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<!-- Hidden data container for QA data -->
<div id="qa-data" data-questions='{{ qa_data | tojson }}' style="display: none;"></div>

<div class="container">
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>Reflection</h2>
        </div>
        <ul class="nav-menu">
            <li><a href="{{ url_for('dashboard') }}" class="nav-link"><span class="nav-icon">🏠</span>Home</a></li>
            <li><a href="{{ url_for('practice') }}" class="nav-link active"><span class="nav-icon">✏️</span>Practice</a></li>
            <li><a href="#" class="nav-link"><span class="nav-icon">📚</span>Resources</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="search-filter-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search questions...">
            </div>

            <div class="filter-dropdown">
                <select id="difficultyFilter">
                    <option value="all">All Difficulties</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
        </div>

        <div id="question-list" class="question-list"></div>
    </main>
</div>

<script type="application/javascript">
    document.addEventListener('DOMContentLoaded', () => {
        // Get QA data from data attribute
        const qaDataElement = document.getElementById('qa-data');
        const questions = JSON.parse(qaDataElement.dataset.questions);

        const questionList = document.getElementById('question-list');
        const searchInput = document.getElementById('searchInput');
        const difficultyFilter = document.getElementById('difficultyFilter');

        // Render Questions
        function renderQuestions(filtered = questions) {
            questionList.innerHTML = '';

            if (!filtered.length) {
                questionList.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No questions match your criteria.</p>';
                return;
            }

            filtered.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <p class="question-text">${i + 1}. ${q.text}</p>
                    <div class="question-meta">
                        <span class="category-tag">${q.category}</span>
                        <span class="difficulty">${q.difficulty}</span>
                    </div>
                `;
                questionList.appendChild(card);
            });
        }

        // Search Filter
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedDifficulty = difficultyFilter.value;

            const filtered = questions.filter(q =>
                (selectedDifficulty === 'all' || q.difficulty === selectedDifficulty) &&
                (q.text.toLowerCase().includes(searchTerm) || q.category.toLowerCase().includes(searchTerm))
            );

            renderQuestions(filtered);
        }

        searchInput.addEventListener('input', applyFilters);
        difficultyFilter.addEventListener('change', applyFilters);

        renderQuestions(); // initial render
    });
</script>
</body>
</html>
