<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - AI Interview Platform</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6B46C1 0%, #7C3AED 25%, #8B5CF6 50%, #4C9FE8 75%, #5BC0DE 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar - Same as home.html */
        .sidebar {
            width: 250px;
            background: rgba(40, 20, 80, 0.95);
            backdrop-filter: blur(15px);
            padding: 30px 0;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 1000;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header {
            padding: 0 30px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .sidebar-header h2 {
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .nav-menu {
            list-style: none;
            padding: 0 20px;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 15px 15px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateX(5px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #9D7FDB 0%, #B399E8 100%);
            color: white;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            font-size: 18px;
        }

        .profile-item {
            margin-top: auto;
            margin-bottom: 0;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 0;
            min-height: 100vh;
            display: flex;
            background: #f5f5f5;
        }

        /* Filter Section */
        .filter-section {
            width: 250px;
            background: rgba(40, 20, 80, 0.95);
            padding: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            height: fit-content;
            max-height: 300px;
        }

        .filter-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .filter-icon {
            margin-right: 10px;
            font-size: 18px;
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-option {
            background: transparent;
            border: 2px solid transparent;
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
        }

        .filter-option:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .filter-option.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ff6b9d;
            color: white;
        }

        /* Question Bank */
        .question-bank {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .question-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .question-item {
            background: linear-gradient(135deg, #f8f9ff 0%, #e8e9ff 100%);
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(107, 70, 193, 0.2);
            position: relative;
            display: flex;
            align-items: center;
        }

        .question-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-color: #6B46C1;
        }

        .question-item::before {
            content: '•';
            color: #6B46C1;
            font-size: 16px;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
            margin: 0;
            flex: 1;
        }


        /* Practice Header */
        .practice-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .practice-title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .practice-subtitle {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .generate-btn {
            background: linear-gradient(135deg, #6B46C1 0%, #8B5CF6 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(107, 70, 193, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading State */
        .loading-state {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            margin-bottom: 30px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6B46C1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }

        /* Error State */
        .error-state {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            margin-bottom: 30px;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 24px;
            color: #dc2626;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 25px;
        }

        .retry-btn {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.4);
        }

        /* Question List */
        .question-list {
            display: grid;
            gap: 30px;
            margin-bottom: 40px;
        }

        /* Question Card */
        .question-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .question-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #6B46C1 0%, #8B5CF6 100%);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .question-number {
            background: linear-gradient(135deg, #6B46C1 0%, #8B5CF6 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .question-rating {
            display: flex;
            gap: 5px;
        }

        .star {
            font-size: 20px;
            color: #e5e7eb;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .star.active {
            color: #fbbf24;
        }

        .question-content {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .question-category {
            display: inline-block;
            background: #f0f9ff;
            color: #0c4a6e;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .next-btn {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .next-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .question-progress {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
        }

        .pagination-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #333;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .pagination-info {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }

            .main-content {
                margin-left: 200px;
                padding: 20px;
            }

            .question-card {
                padding: 20px;
            }

            .question-actions {
                flex-direction: column;
                gap: 15px;
            }

            .next-btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
            }

            .main-content {
                margin-left: 0;
            }

            .container {
                flex-direction: column;
            }
        }

        /* Animation Classes */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Reflection</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="{{ url_for('dashboard') }}" class="nav-link">
                        <span class="nav-icon">🏠</span>
                        Home
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('practice') }}" class="nav-link active">
                        <span class="nav-icon">✏️</span>
                        Practice
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <span class="nav-icon">📚</span>
                        Resource
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-header">
                    <span class="filter-icon">🔽</span>
                    <span class="filter-text">Filter by:</span>
                </div>
                <div class="filter-options">
                    <button class="filter-option active" data-filter="most-asked">Most Asked</button>
                    <button class="filter-option" data-filter="easy">Easy</button>
                    <button class="filter-option" data-filter="intermediate">Intermediate</button>
                    <button class="filter-option" data-filter="difficult">Difficult</button>
                </div>
            </div>

            <!-- Question Bank -->
            <div class="question-bank">
                <div id="question-list" class="question-list">
                    <!-- Questions will be dynamically inserted here -->
                </div>
            </div>

        </main>
    </div>

    <script>
        // Global state
        let allQuestions = [];
        let filteredQuestions = [];
        let currentFilter = 'most-asked';
        let currentQuestion = null;

        // 15 Technical Questions Bank
        const questionBank = [
            {
                id: 1,
                text: "Explain the difference between processes and threads.",
                hint: "Processes are independent programs, threads are smaller tasks inside them.",
                difficulty: "intermediate",
                category: "Operating Systems",
                idealAnswer: "A process is like a full program with its own memory, while threads are smaller parts inside it that share the same memory. Processes are heavier, but threads are lighter and faster. Like a browser is a process, and each tab is a thread."
            },
            {
                id: 2,
                text: "How does a hash map work internally?",
                hint: "Think about key-value pairs and how they're stored and retrieved.",
                difficulty: "intermediate",
                category: "Data Structures",
                idealAnswer: "A hash map uses a hash function to convert keys into array indices. When you store a key-value pair, it calculates the hash of the key and stores the value at that index. For collisions, it uses techniques like chaining or open addressing."
            },
            {
                id: 3,
                text: "What's the difference between SQL and NoSQL databases?",
                hint: "Consider structure, scalability, and use cases.",
                difficulty: "intermediate",
                category: "Databases",
                idealAnswer: "SQL databases are relational with structured schemas, ACID properties, and are great for complex queries. NoSQL databases are non-relational, more flexible, better for big data and real-time applications, but sacrifice some consistency guarantees."
            },
            {
                id: 4,
                text: "Explain the OSI model layers.",
                hint: "Think from physical transmission up to application level.",
                difficulty: "intermediate",
                category: "Networking",
                idealAnswer: "The OSI model has 7 layers: Physical (cables, signals), Data Link (frames, MAC addresses), Network (routing, IP addresses), Transport (TCP/UDP, reliability), Session (connections), Presentation (encryption, compression), and Application (HTTP, FTP, user interfaces)."
            },
            {
                id: 5,
                text: "What's the difference between primary key and foreign key?",
                hint: "Consider uniqueness and relationships between tables.",
                difficulty: "easy",
                category: "Databases",
                idealAnswer: "A primary key uniquely identifies each row in a table and cannot be null. A foreign key is a column that references the primary key of another table, establishing relationships between tables."
            },
            {
                id: 6,
                text: "What's a race condition? How do you handle it?",
                hint: "Think about concurrent access to shared resources.",
                difficulty: "difficult",
                category: "Concurrency",
                idealAnswer: "A race condition occurs when multiple threads access shared data simultaneously, leading to unpredictable results. Handle it using synchronization mechanisms like locks, mutexes, semaphores, or atomic operations to ensure only one thread accesses the resource at a time."
            },
            {
                id: 7,
                text: "Explain the difference between TCP and UDP.",
                hint: "Consider reliability vs speed trade-offs.",
                difficulty: "intermediate",
                category: "Networking",
                idealAnswer: "TCP is connection-oriented, reliable, and guarantees delivery with error checking and flow control. UDP is connectionless, faster, but doesn't guarantee delivery. Use TCP for important data like web pages, UDP for real-time applications like video streaming."
            },
            {
                id: 8,
                text: "What is Big O notation and why is it important?",
                hint: "Think about algorithm efficiency and scalability.",
                difficulty: "intermediate",
                category: "Algorithms",
                idealAnswer: "Big O notation describes how an algorithm's runtime or space requirements grow as input size increases. It helps compare algorithms and predict performance at scale. For example, O(n) means linear growth, O(log n) is logarithmic, and O(n²) is quadratic."
            },
            {
                id: 9,
                text: "How does garbage collection work in programming languages?",
                hint: "Consider memory management and automatic cleanup.",
                difficulty: "difficult",
                category: "Memory Management",
                idealAnswer: "Garbage collection automatically frees memory that's no longer referenced by the program. It works by marking reachable objects and sweeping away unreachable ones. Different strategies include mark-and-sweep, generational GC, and reference counting."
            },
            {
                id: 10,
                text: "What is the difference between REST and GraphQL?",
                hint: "Consider API design and data fetching approaches.",
                difficulty: "intermediate",
                category: "Web Development",
                idealAnswer: "REST uses multiple endpoints for different resources and often leads to over-fetching or under-fetching data. GraphQL uses a single endpoint with a query language, allowing clients to request exactly the data they need, reducing network requests and improving performance."
            },
            {
                id: 11,
                text: "Explain the CAP theorem.",
                hint: "Consider distributed systems and their trade-offs.",
                difficulty: "difficult",
                category: "Distributed Systems",
                idealAnswer: "The CAP theorem states that in a distributed system, you can only guarantee two of three properties: Consistency (all nodes see the same data), Availability (system remains operational), and Partition tolerance (system continues despite network failures). You must choose which two to prioritize."
            },
            {
                id: 12,
                text: "What is the difference between authentication and authorization?",
                hint: "Think about identity vs permissions.",
                difficulty: "easy",
                category: "Security",
                idealAnswer: "Authentication verifies who you are (login credentials, biometrics), while authorization determines what you can do (permissions, roles). Authentication answers 'Are you who you say you are?' Authorization answers 'What are you allowed to do?'"
            },
            {
                id: 13,
                text: "How does a load balancer work?",
                hint: "Consider distributing traffic across multiple servers.",
                difficulty: "intermediate",
                category: "System Design",
                idealAnswer: "A load balancer distributes incoming requests across multiple servers to improve performance, reliability, and scalability. It uses algorithms like round-robin, least connections, or weighted distribution to decide which server handles each request."
            },
            {
                id: 14,
                text: "What is the difference between microservices and monolithic architecture?",
                hint: "Consider application structure and deployment strategies.",
                difficulty: "intermediate",
                category: "Architecture",
                idealAnswer: "Monolithic architecture is a single, large application where all components are tightly coupled and deployed together. Microservices break the application into small, independent services that communicate over networks, allowing independent development, deployment, and scaling."
            },
            {
                id: 15,
                text: "Explain the difference between synchronous and asynchronous programming.",
                hint: "Consider blocking vs non-blocking operations.",
                difficulty: "intermediate",
                category: "Programming Concepts",
                idealAnswer: "Synchronous programming executes code sequentially, blocking until each operation completes. Asynchronous programming allows code to continue executing while waiting for operations to complete, using callbacks, promises, or async/await to handle results when they're ready."
            }
        ];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            initializeQuestions();
            setupFilterHandlers();
        });

        // Initialize questions with default filter
        function initializeQuestions() {
            allQuestions = [...questionBank];
            applyFilter('most-asked');
        }

        // Setup filter event handlers
        function setupFilterHandlers() {
            const filterOptions = document.querySelectorAll('.filter-option');
            filterOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove active class from all options
                    filterOptions.forEach(opt => opt.classList.remove('active'));
                    // Add active class to clicked option
                    this.classList.add('active');
                    
                    // Apply filter
                    const filter = this.getAttribute('data-filter');
                    applyFilter(filter);
                });
            });
        }

        // Apply filter to questions
        function applyFilter(filter) {
            currentFilter = filter;
            
            switch(filter) {
                case 'easy':
                    filteredQuestions = allQuestions.filter(q => q.difficulty === 'easy');
                    break;
                case 'intermediate':
                    filteredQuestions = allQuestions.filter(q => q.difficulty === 'intermediate');
                    break;
                case 'difficult':
                    filteredQuestions = allQuestions.filter(q => q.difficulty === 'difficult');
                    break;
                case 'most-asked':
                default:
                    filteredQuestions = [...allQuestions];
                    break;
            }
            
            displayQuestions();
        }

        // Display filtered questions
        function displayQuestions() {
            const questionList = document.getElementById('question-list');
            questionList.innerHTML = '';

            filteredQuestions.forEach(question => {
                const questionItem = document.createElement('div');
                questionItem.className = 'question-item';
                questionItem.innerHTML = `
                    <p class="question-text">${question.text}</p>
                `;
                
                // Add click handler to open expanded view
                questionItem.addEventListener('click', () => openExpandedQuestion(question));
                
                questionList.appendChild(questionItem);
            });
        }

        // Open question detail page
        function openExpandedQuestion(question) {
            // Navigate to the new question detail page
            const filterParam = currentFilter;
            window.location.href = `/question/${question.id}?filter=${filterParam}`;
        }

        // No need for old answer submission functions since we're using separate page
    </script>
</body>
</html>
