<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Detail - AI Interview Platform</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6B46C1 0%, #7C3AED 25%, #8B5CF6 50%, #4C9FE8 75%, #5BC0DE 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar - Same as practice page */
        .sidebar {
            width: 250px;
            background: rgba(40, 20, 80, 0.95);
            backdrop-filter: blur(15px);
            padding: 30px 0;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 1000;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header {
            padding: 0 30px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .sidebar-header h2 {
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .nav-menu {
            list-style: none;
            padding: 0 20px;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 15px 15px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateX(5px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #9D7FDB 0%, #B399E8 100%);
            color: white;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            font-size: 18px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 0;
            min-height: 100vh;
            background: #f5f5f5;
        }

        /* Back Button */
        .back-button-container {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-button {
            background: linear-gradient(135deg, #6B46C1 0%, #8B5CF6 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(107, 70, 193, 0.3);
        }

        .back-arrow {
            font-size: 16px;
        }

        /* Question Detail Content */
        .question-detail-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            grid-template-rows: auto auto;
            gap: 15px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 80vh;
        }

        .question-section, .answer-section, .analysis-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(107, 70, 193, 0.2);
        }

        .question-section {
            grid-column: 1;
            grid-row: 1;
            height: fit-content;
        }

        .answer-section {
            grid-column: 2;
            grid-row: 1 / 3;
            height: 100%;
            min-height: 500px;
        }

        .analysis-section {
            grid-column: 1;
            grid-row: 2;
            height: fit-content;
        }

        .section-header {
            background: linear-gradient(135deg, #6B46C1 0%, #8B5CF6 100%);
            color: white;
            padding: 12px 20px;
            margin: -20px -20px 15px -20px;
            border-radius: 15px 15px 0 0;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
        }

        .section-content p {
            font-size: 15px;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .question-hint {
            background: rgba(107, 70, 193, 0.08);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
            margin-top: 15px;
            border: 1px solid rgba(107, 70, 193, 0.2);
        }

        .question-hint strong {
            color: #6B46C1;
            font-weight: 600;
        }

        .ideal-answer-display {
            background: rgba(107, 70, 193, 0.08);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            min-height: 300px;
            border: 1px solid rgba(107, 70, 193, 0.2);
        }

        .ideal-answer-display p {
            font-size: 16px;
            line-height: 1.6;
            color: #444;
        }

        .answer-input-section {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 20px;
        }

        .answer-input-section input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }

        .answer-input-section input:focus {
            border-color: #6B46C1;
            background: white;
        }

        .submit-answer-btn {
            background: linear-gradient(135deg, #6B46C1 0%, #8B5CF6 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-answer-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(107, 70, 193, 0.3);
        }

        .analysis-content {
            background: rgba(107, 70, 193, 0.08);
            padding: 20px;
            border-radius: 12px;
            min-height: 200px;
            border: 1px solid rgba(107, 70, 193, 0.2);
        }

        .analysis-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.4;
            padding: 8px 0;
        }

        .analysis-item .icon {
            margin-right: 12px;
            font-size: 16px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .analysis-item:last-child {
            font-weight: 600;
            color: #6B46C1;
            border-top: 1px solid rgba(107, 70, 193, 0.2);
            padding-top: 12px;
            margin-top: 8px;
        }

        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #6B46C1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ffcdd2;
            margin-top: 10px;
        }

        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #c8e6c9;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Reflection</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="{{ url_for('dashboard') }}" class="nav-link">
                        <span class="nav-icon">🏠</span>
                        Home
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('practice') }}" class="nav-link active">
                        <span class="nav-icon">✏️</span>
                        Practice
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <span class="nav-icon">📚</span>
                        Resource
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Back Button -->
            <div class="back-button-container">
                <button id="back-to-questions" class="back-button">
                    <span class="back-arrow">←</span>
                    Back to Questions
                </button>
            </div>
            
            <!-- Question Detail Content -->
            <div class="question-detail-content">
                <div class="question-section">
                    <div class="section-header">
                        <h3>Question</h3>
                    </div>
                    <div class="section-content">
                        <p id="question-text">Loading question...</p>
                        <div class="question-hint">
                            <strong>HINT:</strong> <span id="question-hint">Loading hint...</span>
                        </div>
                    </div>
                </div>
                
                <div class="answer-section">
                    <div class="section-header">
                        <h3>Answer</h3>
                    </div>
                    <div class="section-content">
                        <div class="ideal-answer-display">
                            <p id="ideal-answer">Loading ideal answer...</p>
                        </div>
                        <div class="answer-input-section">
                            <input type="text" id="user-answer" placeholder="Enter your answer here...">
                            <button id="submit-answer" class="submit-answer-btn">→</button>
                        </div>
                        <div id="answer-feedback" style="display: none;"></div>
                    </div>
                </div>
                
                <div class="analysis-section">
                    <div class="section-header">
                        <h3>Analysis</h3>
                    </div>
                    <div class="section-content">
                        <div id="analysis-display" class="analysis-content">
                            <p>Submit your answer to get analysis</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Global state
        let currentQuestion = null;
        let currentFilter = 'most-asked';

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Get question data from URL parameters or localStorage
            loadQuestionData();
            setupEventListeners();
        });

        // Load question data from URL parameters or localStorage
        function loadQuestionData() {
            const urlParams = new URLSearchParams(window.location.search);
            const questionId = urlParams.get('id');
            const filter = urlParams.get('filter') || 'most-asked';
            
            currentFilter = filter;
            
            if (questionId) {
                // Load question from the 15 question bank
                loadQuestionFromBank(parseInt(questionId));
            } else {
                // Try to get question from backend
                loadQuestionFromBackend();
            }
        }

        // Load question from the 15 question bank
        function loadQuestionFromBank(questionId) {
            const questionBank = [
                {
                    id: 1,
                    text: "Explain the difference between processes and threads.",
                    hint: "Processes are independent programs, threads are smaller tasks inside them.",
                    difficulty: "intermediate",
                    category: "Operating Systems",
                    idealAnswer: "A process is like a full program with its own memory, while threads are smaller parts inside it that share the same memory. Processes are heavier, but threads are lighter and faster. Like a browser is a process, and each tab is a thread."
                },
                {
                    id: 2,
                    text: "How does a hash map work internally?",
                    hint: "Think about key-value pairs and how they're stored and retrieved.",
                    difficulty: "intermediate",
                    category: "Data Structures",
                    idealAnswer: "A hash map uses a hash function to convert keys into array indices. When you store a key-value pair, it calculates the hash of the key and stores the value at that index. For collisions, it uses techniques like chaining or open addressing."
                },
                {
                    id: 3,
                    text: "What's the difference between SQL and NoSQL databases?",
                    hint: "Consider structure, scalability, and use cases.",
                    difficulty: "intermediate",
                    category: "Databases",
                    idealAnswer: "SQL databases are relational with structured schemas, ACID properties, and are great for complex queries. NoSQL databases are non-relational, more flexible, better for big data and real-time applications, but sacrifice some consistency guarantees."
                },
                {
                    id: 4,
                    text: "Explain the OSI model layers.",
                    hint: "Think from physical transmission up to application level.",
                    difficulty: "intermediate",
                    category: "Networking",
                    idealAnswer: "The OSI model has 7 layers: Physical (cables, signals), Data Link (frames, MAC addresses), Network (routing, IP addresses), Transport (TCP/UDP, reliability), Session (connections), Presentation (encryption, compression), and Application (HTTP, FTP, user interfaces)."
                },
                {
                    id: 5,
                    text: "What's the difference between primary key and foreign key?",
                    hint: "Consider uniqueness and relationships between tables.",
                    difficulty: "easy",
                    category: "Databases",
                    idealAnswer: "A primary key uniquely identifies each row in a table and cannot be null. A foreign key is a column that references the primary key of another table, establishing relationships between tables."
                },
                {
                    id: 6,
                    text: "What's a race condition? How do you handle it?",
                    hint: "Think about concurrent access to shared resources.",
                    difficulty: "difficult",
                    category: "Concurrency",
                    idealAnswer: "A race condition occurs when multiple threads access shared data simultaneously, leading to unpredictable results. Handle it using synchronization mechanisms like locks, mutexes, semaphores, or atomic operations to ensure only one thread accesses the resource at a time."
                },
                {
                    id: 7,
                    text: "Explain the difference between TCP and UDP.",
                    hint: "Consider reliability vs speed trade-offs.",
                    difficulty: "intermediate",
                    category: "Networking",
                    idealAnswer: "TCP is connection-oriented, reliable, and guarantees delivery with error checking and flow control. UDP is connectionless, faster, but doesn't guarantee delivery. Use TCP for important data like web pages, UDP for real-time applications like video streaming."
                },
                {
                    id: 8,
                    text: "What is Big O notation and why is it important?",
                    hint: "Think about algorithm efficiency and scalability.",
                    difficulty: "intermediate",
                    category: "Algorithms",
                    idealAnswer: "Big O notation describes how an algorithm's runtime or space requirements grow as input size increases. It helps compare algorithms and predict performance at scale. For example, O(n) means linear growth, O(log n) is logarithmic, and O(n²) is quadratic."
                },
                {
                    id: 9,
                    text: "How does garbage collection work in programming languages?",
                    hint: "Consider memory management and automatic cleanup.",
                    difficulty: "difficult",
                    category: "Memory Management",
                    idealAnswer: "Garbage collection automatically frees memory that's no longer referenced by the program. It works by marking reachable objects and sweeping away unreachable ones. Different strategies include mark-and-sweep, generational GC, and reference counting."
                },
                {
                    id: 10,
                    text: "What is the difference between REST and GraphQL?",
                    hint: "Consider API design and data fetching approaches.",
                    difficulty: "intermediate",
                    category: "Web Development",
                    idealAnswer: "REST uses multiple endpoints for different resources and often leads to over-fetching or under-fetching data. GraphQL uses a single endpoint with a query language, allowing clients to request exactly the data they need, reducing network requests and improving performance."
                },
                {
                    id: 11,
                    text: "Explain the CAP theorem.",
                    hint: "Consider distributed systems and their trade-offs.",
                    difficulty: "difficult",
                    category: "Distributed Systems",
                    idealAnswer: "The CAP theorem states that in a distributed system, you can only guarantee two of three properties: Consistency (all nodes see the same data), Availability (system remains operational), and Partition tolerance (system continues despite network failures). You must choose which two to prioritize."
                },
                {
                    id: 12,
                    text: "What is the difference between authentication and authorization?",
                    hint: "Think about identity vs permissions.",
                    difficulty: "easy",
                    category: "Security",
                    idealAnswer: "Authentication verifies who you are (login credentials, biometrics), while authorization determines what you can do (permissions, roles). Authentication answers 'Are you who you say you are?' Authorization answers 'What are you allowed to do?'"
                },
                {
                    id: 13,
                    text: "How does a load balancer work?",
                    hint: "Consider distributing traffic across multiple servers.",
                    difficulty: "intermediate",
                    category: "System Design",
                    idealAnswer: "A load balancer distributes incoming requests across multiple servers to improve performance, reliability, and scalability. It uses algorithms like round-robin, least connections, or weighted distribution to decide which server handles each request."
                },
                {
                    id: 14,
                    text: "What is the difference between microservices and monolithic architecture?",
                    hint: "Consider application structure and deployment strategies.",
                    difficulty: "intermediate",
                    category: "Architecture",
                    idealAnswer: "Monolithic architecture is a single, large application where all components are tightly coupled and deployed together. Microservices break the application into small, independent services that communicate over networks, allowing independent development, deployment, and scaling."
                },
                {
                    id: 15,
                    text: "Explain the difference between synchronous and asynchronous programming.",
                    hint: "Consider blocking vs non-blocking operations.",
                    difficulty: "intermediate",
                    category: "Programming Concepts",
                    idealAnswer: "Synchronous programming executes code sequentially, blocking until each operation completes. Asynchronous programming allows code to continue executing while waiting for operations to complete, using callbacks, promises, or async/await to handle results when they're ready."
                }
            ];

            const question = questionBank.find(q => q.id === questionId);
            if (question) {
                displayQuestion(question);
            } else {
                showError('Question not found');
            }
        }

        // Try to load question from backend
        async function loadQuestionFromBackend() {
            try {
                // This would call your backend API
                // For now, we'll show a default question
                showError('Backend not available. Using question bank.');
                loadQuestionFromBank(1); // Load first question as fallback
            } catch (error) {
                console.error('Error loading from backend:', error);
                loadQuestionFromBank(1); // Fallback to question bank
            }
        }

        // Display question data
        function displayQuestion(question) {
            currentQuestion = question;
            document.getElementById('question-text').textContent = question.text;
            document.getElementById('question-hint').textContent = question.hint;
            document.getElementById('ideal-answer').textContent = question.idealAnswer;
        }

        // Setup event listeners
        function setupEventListeners() {
            // Back button
            document.getElementById('back-to-questions').onclick = function() {
                // Return to practice page with preserved filter state
                window.location.href = `/practice?filter=${currentFilter}`;
            };

            // Submit answer button
            document.getElementById('submit-answer').onclick = function() {
                submitAnswer();
            };

            // Enter key in answer input
            document.getElementById('user-answer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitAnswer();
                }
            });
        }

        // Submit answer for analysis
        async function submitAnswer() {
            const userAnswer = document.getElementById('user-answer').value.trim();
            if (!userAnswer) {
                showFeedback('Please enter an answer', 'error');
                return;
            }

            const submitBtn = document.getElementById('submit-answer');
            const originalText = submitBtn.innerHTML;
            
            // Show loading state
            submitBtn.innerHTML = '<div class="loading-spinner"></div>';
            submitBtn.disabled = true;

            try {
                // Try to send to backend for analysis
                const analysis = await analyzeAnswerWithBackend(userAnswer);
                displayAnalysis(analysis);
                showFeedback('Answer submitted successfully!', 'success');
            } catch (error) {
                console.error('Backend analysis failed:', error);
                // Fallback to local analysis
                const analysis = analyzeAnswerLocally(userAnswer);
                displayAnalysis(analysis);
                showFeedback('Analysis completed (local)', 'success');
            } finally {
                // Reset button
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        // Analyze answer with backend
        async function analyzeAnswerWithBackend(userAnswer) {
            const response = await fetch('/api/practice/analyze-answer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    question: currentQuestion.text,
                    userAnswer: userAnswer,
                    idealAnswer: currentQuestion.idealAnswer
                })
            });

            if (!response.ok) {
                throw new Error('Backend analysis failed');
            }

            const data = await response.json();
            return data.analysis;
        }

        // Local analysis fallback
        function analyzeAnswerLocally(userAnswer) {
            const idealAnswer = currentQuestion.idealAnswer.toLowerCase();
            const userAnswerLower = userAnswer.toLowerCase();
            
            let score = 0;
            let feedback = [];
            
            // Check for key concepts
            const keyWords = idealAnswer.split(' ').filter(word => word.length > 4);
            const matchedWords = keyWords.filter(word => userAnswerLower.includes(word));
            
            if (matchedWords.length > 0) {
                score += 2;
                feedback.push('✓ Good use of technical terms');
            }
            
            // Check answer length
            if (userAnswer.length > 50) {
                score += 1;
                feedback.push('✓ Detailed explanation');
            } else {
                feedback.push('⚠ Could be more detailed');
            }
            
            // Check for examples
            if (userAnswerLower.includes('example') || userAnswerLower.includes('like') || userAnswerLower.includes('such as')) {
                score += 1;
                feedback.push('✓ Good use of examples');
            }
            
            const scoreText = score >= 3 ? 'Excellent' : score >= 2 ? 'Good' : 'Needs improvement';
            
            return {
                score: score,
                feedback: feedback,
                overall: scoreText
            };
        }

        // Display analysis results
        function displayAnalysis(analysis) {
            const analysisDisplay = document.getElementById('detail-analysis-display');
            
            let html = '';
            if (analysis.feedback && analysis.feedback.length > 0) {
                analysis.feedback.forEach(item => {
                    // Add appropriate icons based on feedback type
                    let icon = '✓';
                    if (item.includes('Could') || item.includes('Needs') || item.includes('Missing')) {
                        icon = '⚠';
                    } else if (item.includes('Excellent') || item.includes('Good') || item.includes('Great')) {
                        icon = '✓';
                    }
                    html += `<div class="analysis-item"><span class="icon">${icon}</span>${item}</div>`;
                });
            }
            html += `<div class="analysis-item"><strong>Overall: ${analysis.overall || 'N/A'}</strong></div>`;
            
            analysisDisplay.innerHTML = html;
        }

        // Show feedback message
        function showFeedback(message, type) {
            const feedbackDiv = document.getElementById('answer-feedback');
            feedbackDiv.className = type === 'error' ? 'error-message' : 'success-message';
            feedbackDiv.textContent = message;
            feedbackDiv.style.display = 'block';
            
            setTimeout(() => {
                feedbackDiv.style.display = 'none';
            }, 3000);
        }

        // Show error message
        function showError(message) {
            const analysisDisplay = document.getElementById('analysis-display');
            analysisDisplay.innerHTML = `<div class="error-message">${message}</div>`;
        }
    </script>
</body>
</html>
