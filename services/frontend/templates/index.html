<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Interview Platform</title>
    <style>
        /* Import Inter font - must be first */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        /* ============================================
           GLOBAL STYLES & RESET
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling with mint theme */
        body {
            font-family: 'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #e9fff4 0%, #c7f5d9 25%, #a6e8c5 50%, #e9fff4 75%, #f8f9fb 100%);
            color: #2c3034;
            min-height: 100vh;
        }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            background: rgba(231, 255, 244, 0.8);
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(199, 245, 217, 0.5);
        }

        .navbar:hover {
            background: rgba(231, 255, 244, 0.95);
        }

        .nav-btn {
            padding: 14px 35px;
            background: #f8f9fb;
            border: 1px solid #d0d4d9;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #2c3034;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* Smooth hover animation for nav buttons */
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(199, 245, 217, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            background: #c7f5d9;
            border-color: #a6e8c5;
        }

        .nav-btn:active {
            transform: translateY(0) scale(1);
        }

        .nav-btn:last-child {
            background: #c7f5d9;
            color: #2c3034;
            border: 2px solid #a6e8c5;
        }

        .nav-btn:last-child:hover {
            border-color: #a6e8c5;
            background: #a6e8c5;
            color: #2c3034;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #c7f5d9 0%, #a6e8c5 100%);
            color: #2c3034;
            border: 2px solid #a6e8c5;
        }

        .nav-btn.active:hover {
            background: linear-gradient(135deg, #a6e8c5 0%, #c7f5d9 100%);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(166, 232, 197, 0.3);
        }

        /* ============================================
           HERO SECTION
           ============================================ */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 80px;
            overflow: hidden;
        }

        /* Mint gradient background */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e9fff4 0%, #c7f5d9 25%, #a6e8c5 50%, #e9fff4 75%, #f8f9fb 100%);
            z-index: -2;
            animation: gradientShift 15s ease infinite;
        }

        /* Subtle background animation */
        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Content wrapper */
        .content-wrapper {
            max-width: 750px;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        /* ============================================
           MAIN CARD WITH HOVER EFFECTS
           ============================================ */
        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 50px;
            margin-bottom: 35px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(199, 245, 217, 0.5);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* Hover effect for main card */
        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(199, 245, 217, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .main-card:hover::before {
            left: 100%;
        }

        .main-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-color: #a6e8c5;
        }

        .main-title {
            font-size: 56px;
            font-weight: 700;
            color: #2c3034;
            line-height: 1.2;
            margin-bottom: 0;
            transition: all 0.2s ease;
        }

        .main-card:hover .main-title {
            color: #1a1d21;
        }

        /* ============================================
           SUBTITLE CARD WITH HOVER EFFECTS
           ============================================ */
        .subtitle-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 35px 45px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(199, 245, 217, 0.5);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease-out;
        }

        /* Hover effect for subtitle card */
        .subtitle-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(199, 245, 217, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .subtitle-card:hover::before {
            left: 100%;
        }

        .subtitle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-color: #a6e8c5;
            background: rgba(255, 255, 255, 1);
        }

        .subtitle {
            font-size: 22px;
            color: #2c3034;
            line-height: 1.6;
            margin: 0;
            transition: all 0.2s ease;
        }

        .subtitle-card:hover .subtitle {
            color: #1a1d21;
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 1024px) {
            .navbar {
                padding: 15px 30px;
                gap: 15px;
            }

            .nav-btn {
                padding: 12px 25px;
                font-size: 16px;
            }

            .hero {
                padding: 0 40px;
            }

            .main-title {
                font-size: 48px;
            }

            .subtitle {
                font-size: 20px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .hero {
                padding: 0 30px;
            }

            .main-card {
                padding: 30px;
            }

            .main-title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
            }

            .subtitle-card {
                padding: 25px 30px;
            }
        }

        @media (max-width: 480px) {
            .main-card {
                padding: 25px;
            }

            .main-title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
            }

            .subtitle-card {
                padding: 20px 25px;
            }
        }
        /* ============================================
           ACCESSIBILITY TOOLBAR STYLES
           Kept very scoped to avoid interfering with site styles
           ============================================ */
        #a11y-toolbar {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
            font-family: inherit;
        }

        .a11y-icons {
            display: flex;
            gap: 8px;
        }

        .a11y-icon-btn {
            background: #ffffffcc;
            border: 1px solid #d0d4d9;
            border-radius: 10px;
            padding: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }

        .a11y-icon-btn:focus {
            outline: 3px solid #a6e8c5;
            outline-offset: 2px;
        }

        .a11y-menu {
            margin-top: 6px;
            display: none;
            background: rgba(255,255,255,0.98);
            border: 1px solid rgba(208,212,217,0.8);
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            min-width: 190px;
            flex-direction: column;
            gap: 6px;
        }

        .a11y-menu[aria-hidden="false"] {
            display: flex;
        }

        .a11y-option {
            background: transparent;
            border: 0;
            text-align: left;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            color: #2c3034;
        }

        .a11y-option:hover,
        .a11y-option:focus {
            background: #f1f8f4;
            outline: none;
        }

        /* Accessibility feature classes applied to <body> */
        /* Visual alteration helpers - apply strongly to all descendants
           so components that set colors/backgrounds won't block the feature */
        body.a11y-grayscale {
            filter: grayscale(100%) !important;
        }

        body.a11y-negative {
            filter: invert(100%) hue-rotate(180deg) !important;
        }

        /* High contrast: force dark background and light text everywhere */
        body.a11y-high-contrast,
        body.a11y-high-contrast * {
            background-color: #000 !important;
            background: #000 !important;
            color: #fff !important;
            border-color: #fff !important;
            box-shadow: none !important;
        }

        /* Light background: convert every background to white and dark text */
        body.a11y-light-bg,
        body.a11y-light-bg * {
            background-color: #ffffff !important;
            background: #ffffff !important;
            color: #111 !important;
            border-color: #e6e6e6 !important;
            box-shadow: none !important;
        }

        body.a11y-underline a,
        a.a11y-underline {
            text-decoration: underline !important;
        }

        body.a11y-readable {
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif !important;
            font-size: 1.05rem !important;
            line-height: 1.7 !important;
        }
    </style>
</head>
<body>
    <!-- Accessibility toolbar (top-left) -->
    <div id="a11y-toolbar" aria-hidden="false">
        <div class="a11y-icons">
            <button id="a11y-person-btn" class="a11y-icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="a11y-menu" title="Accessibility options" aria-label="Accessibility options">
                <!-- person icon (inline SVG) -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 12c2.7614 0 5-2.2386 5-5s-2.2386-5-5-5-5 2.2386-5 5 2.2386 5 5 5z" fill="#2c3034" />
                    <path d="M4 20c0-4.4183 3.5817-8 8-8s8 3.5817 8 8v1H4v-1z" fill="#2c3034" />
                </svg>
            </button>

            <button id="a11y-speaker-btn" class="a11y-icon-btn" aria-pressed="false" title="Read page aloud" aria-label="Read page aloud">
                <!-- speaker icon -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M5 9v6h4l5 4V5L9 9H5z" fill="#2c3034" />
                    <path d="M16.5 8.5a4.5 4.5 0 010 7" stroke="#2c3034" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div id="a11y-menu" class="a11y-menu" role="menu" aria-hidden="true">
            <button role="menuitem" class="a11y-option" data-action="increase">Increase Text</button>
            <button role="menuitem" class="a11y-option" data-action="decrease">Decrease Text</button>
            <button role="menuitem" class="a11y-option" data-action="grayscale">Grayscale</button>
            <button role="menuitem" class="a11y-option" data-action="high-contrast">High Contrast</button>
            <button role="menuitem" class="a11y-option" data-action="negative">Negative Contrast</button>
            <button role="menuitem" class="a11y-option" data-action="light-bg">Light Background</button>
            <button role="menuitem" class="a11y-option" data-action="underline">Links Underline</button>
            <button role="menuitem" class="a11y-option" data-action="readable-font">Readable Font</button>
            <button role="menuitem" class="a11y-option" data-action="reset">Reset</button>
        </div>
    </div>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="{{ url_for('about') }}" class="nav-btn">About Us</a>
        <a href="{{ url_for('testimonials') }}" class="nav-btn">Testimonials</a>
        <a href="{{ url_for('privacy') }}" class="nav-btn">Privacy Policy</a>
        <a href="{{ url_for('contact') }}" class="nav-btn">Contact Us</a>
        <a href="{{ url_for('login') }}" class="nav-btn">Login</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Content -->
        <div class="content-wrapper">
            <div class="main-card">
                <h1 class="main-title">AI-Powered Interview Questions for Every Career Path.</h1>
            </div>

            <div class="subtitle-card">
                <p class="subtitle">Practice real-world interview scenarios with instant feedback to boost your confidence and performance.</p>
            </div>
        </div>
    </section>
    <script>
        (function () {
            const personBtn = document.getElementById('a11y-person-btn');
            const menu = document.getElementById('a11y-menu');
            const speakerBtn = document.getElementById('a11y-speaker-btn');
            const options = Array.from(document.querySelectorAll('.a11y-option'));
            const body = document.body;

            // Increase/Decrease fonts by px per click. Store original computed sizes on first change.
            function adjustAllFonts(deltaPx) {
                const els = Array.from(document.querySelectorAll('body *'));
                els.forEach(el => {
                    const tag = el.tagName;
                    if (!el || !el.style || ['SCRIPT','STYLE','SVG','CANVAS','PATH','G','IMG','VIDEO','AUDIO','IFRAME'].includes(tag)) return;
                    const cs = window.getComputedStyle(el);
                    if (!cs) return;
                    const fs = cs.fontSize;
                    if (!fs || fs.indexOf('px') === -1) return;
                    // store original computed size once
                    if (!el.dataset.a11yOriginalFont) el.dataset.a11yOriginalFont = fs;
                    // prefer inline style if already adjusted
                    const current = parseFloat(el.style.fontSize || fs);
                    let newSize = Math.round(current + deltaPx);
                    if (newSize < 8) newSize = 8;
                    if (newSize > 500) newSize = 500;
                    el.style.fontSize = newSize + 'px';
                });
            }

            function resetFonts() {
                const els = Array.from(document.querySelectorAll('[data-a11y-original-font]'));
                els.forEach(el => {
                    const orig = el.dataset.a11yOriginalFont;
                    if (orig) {
                        // restore original computed size as inline style to be explicit
                        el.style.fontSize = orig;
                    } else {
                        el.style.fontSize = '';
                    }
                    delete el.dataset.a11yOriginalFont;
                });
            }

            function toggleMenu() {
                const hidden = menu.getAttribute('aria-hidden') === 'true';
                if (hidden) {
                    menu.setAttribute('aria-hidden', 'false');
                    personBtn.setAttribute('aria-expanded', 'true');
                    const first = menu.querySelector('.a11y-option');
                    if (first) first.focus();
                } else {
                    menu.setAttribute('aria-hidden', 'true');
                    personBtn.setAttribute('aria-expanded', 'false');
                }
            }

            function toggleClass(cls) {
                body.classList.toggle(cls);
            }

            function resetA11y() {
                ['a11y-grayscale','a11y-high-contrast','a11y-negative','a11y-light-bg','a11y-underline','a11y-readable'].forEach(c => body.classList.remove(c));
                resetFonts();
                // stop speech if running
                try {
                    if (window.speechSynthesis && window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                        speakerBtn.setAttribute('aria-pressed','false');
                    }
                } catch (e) {}
            }

            options.forEach(opt => {
                opt.addEventListener('click', () => {
                    const act = opt.getAttribute('data-action');
                    switch (act) {
                        case 'increase':
                            adjustAllFonts(1); // +1px per click
                            break;
                        case 'decrease':
                            adjustAllFonts(-1); // -1px per click
                            break;
                        case 'grayscale':
                            toggleClass('a11y-grayscale');
                            break;
                        case 'high-contrast':
                            toggleClass('a11y-high-contrast');
                            break;
                        case 'negative':
                            toggleClass('a11y-negative');
                            break;
                        case 'light-bg':
                            toggleClass('a11y-light-bg');
                            break;
                        case 'underline':
                            toggleClass('a11y-underline');
                            break;
                        case 'readable-font':
                            toggleClass('a11y-readable');
                            break;
                        case 'reset':
                            resetA11y();
                            break;
                    }
                    // keep focus on the clicked option for keyboard users
                    opt.focus();
                });
                // allow keyboard activation
                opt.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        opt.click();
                    }
                });
            });

            personBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });
            personBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMenu();
                }
            });

            // Close menu on Escape only (not on outside click per request)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    menu.setAttribute('aria-hidden','true');
                    personBtn.setAttribute('aria-expanded','false');
                }
            });

            // Speech synthesis
            function speakPage() {
                if (!('speechSynthesis' in window)) return;
                try {
                    if (window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                        speakerBtn.setAttribute('aria-pressed','false');
                        return;
                    }
                    const wrapper = document.querySelector('.content-wrapper');
                    const text = wrapper ? wrapper.innerText.trim() : document.body.innerText.trim();
                    if (!text) return;
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.rate = 1;
                    utter.pitch = 1;
                    utter.onend = () => speakerBtn.setAttribute('aria-pressed','false');
                    window.speechSynthesis.speak(utter);
                    speakerBtn.setAttribute('aria-pressed','true');
                } catch (e) {
                    console.warn('Speech failed', e);
                }
            }

            speakerBtn.addEventListener('click', speakPage);
            speakerBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    speakPage();
                }
            });

            // initialize ARIA
            menu.setAttribute('aria-hidden','true');
            personBtn.setAttribute('aria-expanded','false');
            speakerBtn.setAttribute('aria-pressed','false');
        })();
    </script>
</body>
</html>
