<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Interview Platform</title>
    <style>
        /* Import Inter font - must be first */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        /* ============================================
           GLOBAL STYLES & RESET
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling with mint theme */
        body {
            font-family: 'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #e9fff4 0%, #c7f5d9 25%, #a6e8c5 50%, #e9fff4 75%, #f8f9fb 100%);
            color: #2c3034;
            min-height: 100vh;
        }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            background: rgba(231, 255, 244, 0.8);
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(199, 245, 217, 0.5);
        }

        .navbar:hover {
            background: rgba(231, 255, 244, 0.95);
        }

        .nav-btn {
            padding: 14px 35px;
            background: #f8f9fb;
            border: 1px solid #d0d4d9;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #2c3034;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* Smooth hover animation for nav buttons */
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(199, 245, 217, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            background: #c7f5d9;
            border-color: #a6e8c5;
        }

        .nav-btn:active {
            transform: translateY(0) scale(1);
        }

        .nav-btn:last-child {
            background: #c7f5d9;
            color: #2c3034;
            border: 2px solid #a6e8c5;
        }

        .nav-btn:last-child:hover {
            border-color: #a6e8c5;
            background: #a6e8c5;
            color: #2c3034;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #c7f5d9 0%, #a6e8c5 100%);
            color: #2c3034;
            border: 2px solid #a6e8c5;
        }

        .nav-btn.active:hover {
            background: linear-gradient(135deg, #a6e8c5 0%, #c7f5d9 100%);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(166, 232, 197, 0.3);
        }

        /* ============================================
           HERO SECTION
           ============================================ */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 80px;
            overflow: hidden;
        }

        /* Mint gradient background */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e9fff4 0%, #c7f5d9 25%, #a6e8c5 50%, #e9fff4 75%, #f8f9fb 100%);
            z-index: -2;
            animation: gradientShift 15s ease infinite;
        }

        /* Subtle background animation */
        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Content wrapper */
        .content-wrapper {
            max-width: 750px;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        /* ============================================
           MAIN CARD WITH HOVER EFFECTS
           ============================================ */
        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 50px;
            margin-bottom: 35px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(199, 245, 217, 0.5);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* Hover effect for main card */
        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(199, 245, 217, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .main-card:hover::before {
            left: 100%;
        }

        .main-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-color: #a6e8c5;
        }

        .main-title {
            font-size: 56px;
            font-weight: 700;
            color: #2c3034;
            line-height: 1.2;
            margin-bottom: 0;
            transition: all 0.2s ease;
        }

        .main-card:hover .main-title {
            color: #1a1d21;
        }

        /* ============================================
           SUBTITLE CARD WITH HOVER EFFECTS
           ============================================ */
        .subtitle-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 35px 45px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(199, 245, 217, 0.5);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease-out;
        }

        /* Hover effect for subtitle card */
        .subtitle-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(199, 245, 217, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .subtitle-card:hover::before {
            left: 100%;
        }

        .subtitle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-color: #a6e8c5;
            background: rgba(255, 255, 255, 1);
        }

        .subtitle {
            font-size: 22px;
            color: #2c3034;
            line-height: 1.6;
            margin: 0;
            transition: all 0.2s ease;
        }

        .subtitle-card:hover .subtitle {
            color: #1a1d21;
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 1024px) {
            .navbar {
                padding: 15px 30px;
                gap: 15px;
            }

            .nav-btn {
                padding: 12px 25px;
                font-size: 16px;
            }

            .hero {
                padding: 0 40px;
            }

            .main-title {
                font-size: 48px;
            }

            .subtitle {
                font-size: 20px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .hero {
                padding: 0 30px;
            }

            .main-card {
                padding: 30px;
            }

            .main-title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
            }

            .subtitle-card {
                padding: 25px 30px;
            }
        }

        @media (max-width: 480px) {
            .main-card {
                padding: 25px;
            }

            .main-title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
            }

            .subtitle-card {
                padding: 20px 25px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="{{ url_for('about') }}" class="nav-btn">About Us</a>
        <a href="{{ url_for('testimonials') }}" class="nav-btn">Testimonials</a>
        <a href="{{ url_for('privacy') }}" class="nav-btn">Privacy Policy</a>
        <a href="{{ url_for('contact') }}" class="nav-btn">Contact Us</a>
        <a href="{{ url_for('login') }}" class="nav-btn">Login</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Content -->
        <div class="content-wrapper">
            <div class="main-card">
                <h1 class="main-title">AI-Powered Interview Questions for Every Career Path.</h1>
            </div>

            <div class="subtitle-card">
                <p class="subtitle">Practice real-world interview scenarios with instant feedback to boost your confidence and performance.</p>
            </div>
        </div>
    </section>
</body>
</html>
