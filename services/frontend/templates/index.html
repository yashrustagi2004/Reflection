<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Interview Platform</title>
    <style>
        /* ============================================
           GLOBAL STYLES & RESET
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling with consistent gradient background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(100, 50, 150, 0.4), transparent);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .navbar:hover {
            background: linear-gradient(to bottom, rgba(100, 50, 150, 0.6), transparent);
        }

        .nav-btn {
            padding: 14px 35px;
            background: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        /* Smooth hover animation for nav buttons */
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(107, 70, 193, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            background: #f8f9fa;
        }

        .nav-btn:active {
            transform: translateY(-1px);
        }

        .nav-btn:last-child {
            background: white;
            color: #333;
            border: 3px solid #333;
        }

        .nav-btn:last-child:hover {
            border-color: #6B46C1;
            background: #6B46C1;
            color: white;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #9D7FDB 0%, #B399E8 100%);
            color: white;
            border: none;
        }

        .nav-btn.active:hover {
            background: linear-gradient(135deg, #8B6BC9 0%, #A185D6 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(157, 127, 219, 0.4);
        }

        /* ============================================
           HERO SECTION
           ============================================ */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 80px;
            overflow: hidden;
        }

        /* Animated gradient background */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #6B46C1 0%, #7C3AED 25%, #8B5CF6 50%, #4C9FE8 75%, #5BC0DE 100%);
            z-index: -2;
            animation: gradientShift 15s ease infinite;
        }

        /* Subtle background animation */
        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Content wrapper */
        .content-wrapper {
            max-width: 750px;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        /* ============================================
           MAIN CARD WITH HOVER EFFECTS
           ============================================ */
        .main-card {
            background: rgba(40, 20, 80, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 50px;
            margin-bottom: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        /* Hover effect for main card */
        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .main-card:hover::before {
            left: 100%;
        }

        .main-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .main-title {
            font-size: 56px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
            margin-bottom: 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .main-card:hover .main-title {
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* ============================================
           SUBTITLE CARD WITH HOVER EFFECTS
           ============================================ */
        .subtitle-card {
            background: rgba(40, 20, 80, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 35px 45px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease-out;
        }

        /* Hover effect for subtitle card */
        .subtitle-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: left 0.6s ease;
        }

        .subtitle-card:hover::before {
            left: 100%;
        }

        .subtitle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(40, 20, 80, 0.92);
        }

        .subtitle {
            font-size: 22px;
            color: white;
            line-height: 1.6;
            margin: 0;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .subtitle-card:hover .subtitle {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 1024px) {
            .navbar {
                padding: 15px 30px;
                gap: 15px;
            }

            .nav-btn {
                padding: 12px 25px;
                font-size: 16px;
            }

            .hero {
                padding: 0 40px;
            }

            .main-title {
                font-size: 48px;
            }

            .subtitle {
                font-size: 20px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .hero {
                padding: 0 30px;
            }

            .main-card {
                padding: 30px;
            }

            .main-title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
            }

            .subtitle-card {
                padding: 25px 30px;
            }
        }

        @media (max-width: 480px) {
            .main-card {
                padding: 25px;
            }

            .main-title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
            }

            .subtitle-card {
                padding: 20px 25px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="{{ url_for('about') }}" class="nav-btn">About Us</a>
        <a href="{{ url_for('testimonials') }}" class="nav-btn">Testimonials</a>
        <a href="{{ url_for('privacy') }}" class="nav-btn">Privacy Policy</a>
        <a href="{{ url_for('contact') }}" class="nav-btn">Contact Us</a>
        <a href="{{ url_for('login') }}" class="nav-btn">Login</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Content -->
        <div class="content-wrapper">
            <div class="main-card">
                <h1 class="main-title">AI-Powered Interview Questions for Every Career Path.</h1>
            </div>

            <div class="subtitle-card">
                <p class="subtitle">Practice real-world interview scenarios with instant feedback to boost your confidence and performance.</p>
            </div>
        </div>
    </section>
</body>
</html>
